[workspace]
resolver = "2"
members = [
    "fastwarc-rs",
    # Not a default member: building fastwarc-grpc requires protoc on the PATH.
    "fastwarc-grpc",
    "fastwarc-py/fastwarc",
    "resiliparse-rs",
    "resiliparse-py/resiliparse/parse/_html_rs",
]
default-members = [
    "fastwarc-rs",
    "resiliparse-rs",
]

[workspace.package]
version = "1.0.9"
edition = "2024"
publish = true
description = "A collection of robust and fast processing tools for parsing and analyzing (not only) web archive data."
authors = ["Janek Bevendorff"]
documentation = "https://resiliparse.chatnoir.eu/"
readme = "README.md"
repository = "https://github.com/chatnoir-eu/chatnoir-resiliparse/"
license = "Apache-2.0"

[workspace.dependencies]
bindgen = "0.72"
pyo3 = "0.28"
pyo3-build-config = "0.28"
pretty_assertions = "1.4"
memchr = "2.7"
time = { version = "0.3", features = ["formatting", "parsing", "macros"] }

[workspace]
resolver = "2"
members = [
    "resiliparse-rs",
    "resiliparse-py/resiliparse",
    "fastwarc-rs",
    "fastwarc-grpc",
    "fastwarc-py/fastwarc",
]
default-members = [
    "fastwarc-rs",
    "resiliparse-rs",
]

[workspace.package]
version = "2.0.0"
edition = "2024"
publish = true
description = "A collection of robust and fast processing tools for parsing and analyzing (not only) web archive data."
authors = ["Janek Bevendorff"]
documentation = "https://resiliparse.chatnoir.eu/"
readme = "README.md"
repository = "https://github.com/chatnoir-eu/chatnoir-resiliparse/"
license = "Apache-2.0"

[workspace.dependencies]
fastwarc = { version = "2.0.0", path = "fastwarc-rs" }
resiliparse = { version = "2.0.0", path = "resiliparse-rs" }
bindgen = { version = "0.73", default-features = false, features = ["logging", "runtime"] }
pyo3 = "0.30"
pyo3-build-config = "0.30"
pretty_assertions = "1.4"
rstest = { version = "0.28", default-features = false }
memchr = "2.7"
time = { version = "0.3", features = ["formatting", "parsing", "macros"] }

[build-system]
requires = ["maturin>=1.9,<2.0"]
build-backend = "maturin"

[project]
name = "FastWARC"
dynamic = ["version"]
description = "The world's fastest WARC parsing library written in Rust with bindings for Python."
authors = [
    { name = "Janek Bevendorff" }
]
license = "Apache-2.0"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "brotli",
    "click",
    "tqdm",
    "typing_extensions>=4.15; python_version < '3.13'",
]

[project.urls]
repository = "https://github.com/chatnoir-eu/chatnoir-resiliparse"
homepage = "https://resiliparse.chatnoir.eu"
documentation = "https://resiliparse.chatnoir.eu"

[project.optional-dependencies]
all = [
    "fastwarc[fsspec]"
]
fsspec = [
    "fsspec",
    "s3fs",
]
test = [
    "fastwarc[all]",
    "pytest>=7.2.2",
    "pytest-cov>=4.0.0",
]

[project.scripts]
fastwarc = "fastwarc.cli:main"

[tool.maturin]
manifest-path = "fastwarc/Cargo.toml"
python-source = "."
module-name = "fastwarc._fastwarc"
bindings = "pyo3"
sdist-generator = "cargo"

[tool.cibuildwheel]
archs = "native"
build = "cp3*"
build-frontend = "build"
test-extras = ["all", "test"]

[tool.mypy]
exclude = [
    "fastwarc/cli\\.py",
    "tests/.*",
]

[[tool.mypy.overrides]]
module = ["fsspec.*"]
ignore_missing_imports = true

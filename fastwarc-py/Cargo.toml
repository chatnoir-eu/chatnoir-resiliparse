[package]
name = "fastwarc-py"
version.workspace = true
edition.workspace = true
publish = false
exclude = ["build/**", "*.egg-info/**", "resiliparse_common/**", "resiliparse_inc/**", ".mypy_cache/**"]

[lib]
name = "fastwarc"
path = "src/lib.rs"
crate-type = ["cdylib"]

[dependencies]
fastwarc.workspace = true
pyo3 = { workspace = true, features = ["extension-module"] }
time.workspace = true

[build-dependencies]
pyo3-build-config.workspace = true

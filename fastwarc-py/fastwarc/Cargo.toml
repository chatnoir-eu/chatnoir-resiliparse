[package]
name = "fastwarc-py"
version.workspace = true
edition.workspace = true
publish = false

[lib]
name = "fastwarc"
path = "src/lib.rs"
crate-type = ["cdylib"]

[dependencies]
fastwarc = { version = "2.0.0", path = "../../fastwarc-rs" }
pyo3 = { workspace = true, features = ["extension-module"] }
time.workspace = true

[build-dependencies]
pyo3-build-config.workspace = true

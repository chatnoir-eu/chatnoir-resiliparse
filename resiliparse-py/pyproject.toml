[build-system]
requires = ["maturin>=1.9,<2.0"]
build-backend = "maturin"

[project]
name = "Resiliparse"
dynamic = ["version"]
description = "A collection of robust and fast processing tools for parsing and analyzing (not only) web archive data."
authors = [
    { name = "Janek Bevendorff" }
]
license = "Apache-2.0"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "fastwarc==2.0.0"
]

[project.urls]
repository = "https://github.com/chatnoir-eu/chatnoir-resiliparse"
homepage = "https://resiliparse.chatnoir.eu"
documentation = "https://resiliparse.chatnoir.eu"

[project.optional-dependencies]
all = [
    "resiliparse[beam,cli]"
]
beam = [
    # apache_beam has no free-threaded Python wheels: exclude for 3.14 and up
    "apache_beam[aws]>=2.37.0; python_version<'3.14'",
    "boto3>=1.9",
    "elasticsearch>=7.0.0"
]
cli = [
    "click",
    "joblib",
    "tqdm"
]
cli-benchmark = [
    "beautifulsoup4",
    "langid",
    "selectolax"
]
test = [
    "resiliparse[all]",
    "pytest>=7.2.2",
    "pytest-cov>=4.0.0"
]

[project.scripts]
resiliparse = "resiliparse.cli:main"

[tool.maturin]
manifest-path = "Cargo.toml"
python-source = "python"
module-name = "resiliparse._resiliparse"
bindings = "pyo3"
sdist-generator = "cargo"

[tool.cibuildwheel]
archs = "native"
build = "cp3*"
build-frontend = "build"
test-extras = ["all", "test"]

[tool.mypy]
exclude = [
    "python/resiliparse/cli\\.py",
    "python/resiliparse/beam/.*",
    "tests/.*",
]

[[tool.mypy.overrides]]
module = ["apache_beam.*"]
ignore_missing_imports = true

[build-system]
requires = ["setuptools>=77.0", "packaging>=24.2", "Cython>=0.29.33", "setuptools-rust>=1.10"]
build-backend = "setuptools.build_meta"

[project]
name = "Resiliparse"
version = "1.2.0"
description = "A collection of robust and fast processing tools for parsing and analyzing (not only) web archive data."
authors = [
    { name = "Janek Bevendorff" }
]
license = "Apache-2.0"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "fastwarc==1.2.0"
]

[project.urls]
repository = "https://github.com/chatnoir-eu/chatnoir-resiliparse"
homepage = "https://resiliparse.chatnoir.eu"
documentation = "https://resiliparse.chatnoir.eu"

[project.optional-dependencies]
all = [
    "resiliparse[beam,cli]"
]
beam = [
    # apache_beam has no free-threaded Python wheels: exclude for 3.14 and up
    "apache_beam[aws]>=2.37.0; python_version<'3.14'",
    "boto3>=1.9",
    "elasticsearch>=7.0.0"
]
cli = [
    "click",
    "joblib",
    "tqdm"
]
cli-benchmark = [
    "beautifulsoup4",
    "langid",
    "selectolax"
]
test = [
    "resiliparse[all]",
    "pytest>=7.2.2",
    "pytest-cov>=4.0.0"
]

[project.scripts]
resiliparse = "resiliparse.cli:main"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
include = ["resiliparse*"]
exclude = ["resiliparse.src*"]
namespaces = true

[tool.setuptools.package-data]
"*" = ["*.pyi", "py.typed"]

[tool.cibuildwheel]
archs = "native"
build = "cp3*"
build-frontend = "build"
test-extras = ["all", "test"]

[tool.mypy]
exclude = [
    "resiliparse/cli\\.py",
    "resiliparse/beam/.*",
    "resiliparse/itertools\\.py", # itertools includes legacy FastWARC
    "resiliparse/legacy/.*",
    "resiliparse-pytest/.*",
]

[[tool.mypy.overrides]]
module = ["apache_beam.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["resiliparse.legacy.*"]
follow_imports = "skip"
ignore_missing_imports = true

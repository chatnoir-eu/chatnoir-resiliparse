[package]
name = "fastwarc-grpc"
description = "Streaming gRPC server for the FastWARC WARC parser"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = true
authors = ["Kristian Rickert <krickert@gmail.com>"]
documentation.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["warc", "grpc", "fastwarc", "webarchive"]
categories = ["network-programming", "parser-implementations"]

[dependencies]
cap-std = "4"
fastwarc = { version = "1", path = "../fastwarc-rs" }
prost = "0.14"
prost-types = "0.14"
tonic = "0.14"
tonic-prost = "0.14"
tonic-health = "0.14"
tonic-reflection = "0.14"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "sync", "net"] }
tokio-stream = { version = "0.1", features = ["net"] }
time.workspace = true

[build-dependencies]
tonic-prost-build = "0.14"

[dev-dependencies]
rstest.workspace = true
tempfile = "3"
tokio-stream = { version = "0.1", features = ["net"] }
tokio = { version = "1", features = ["time"] }

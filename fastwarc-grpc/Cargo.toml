[package]
name = "fastwarc-grpc"
description = "Streaming gRPC server for the FastWARC WARC parser"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false
authors = ["Kristian Rickert <krickert@gmail.com>"]
documentation.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["warc", "grpc", "fastwarc", "webarchive"]
categories = ["network-programming", "parser-implementations"]

[dependencies]
fastwarc = { version = "1", path = "../fastwarc-rs" }
prost = "0.14"
prost-types = "0.14"
tonic = "0.14"
tonic-prost = "0.14"
tonic-health = "0.14"
tonic-reflection = "0.14"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "sync", "net"] }
tokio-stream = "0.1"
# Only OffsetDateTime accessors are used; fastwarc's public API exposes the
# type, so the dependency is unavoidable but needs no extra features.
time.workspace = true

[build-dependencies]
tonic-prost-build = "0.14"

[dev-dependencies]
# "net" enables TcpListenerStream for the in-process integration test server.
tokio-stream = { version = "0.1", features = ["net"] }

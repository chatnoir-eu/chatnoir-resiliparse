name: Build manylinux docker container

on:
  workflow_dispatch:

  push:
    branches:
      - develop
      - ci/*
    paths:
      - Dockerfile
      - .github/workflows/build-docker.yml
      - resiliparse-rs/vcpkg/**
      - resiliparse-rs/vcpkg.json
      - resiliparse-rs/vcpkg-configuration.json

  pull_request:
    types:
      - opened
      - synchronize
    branches:
      - develop
    paths:
      - Dockerfile
      - .github/workflows/build-docker.yml
      - resiliparse-rs/vcpkg/**
      - resiliparse-rs/vcpkg.json
      - resiliparse-rs/vcpkg-configuration.json

env:
  REGISTRY: ghcr.io

jobs:
  build:
    strategy:
      matrix:
        runner:
          - { os: ubuntu-24.04, platform: linux/amd64 }
          - { os: ubuntu-24.04-arm, platform: linux/arm64 }

    runs-on: ${{ matrix.runner.os }}
    permissions:
      contents: read
      packages: write

    steps:
      - name: Prepare
        run: |
          if [ "${{ matrix.runner.platform }}" = "linux/amd64" ]; then
            echo "TARGET_ARCH=x86_64" >> "$GITHUB_ENV"
          elif [ "${{ matrix.runner.platform }}" = "linux/arm64" ]; then
            echo "TARGET_ARCH=aarch64" >> "$GITHUB_ENV"
          fi

      - name: Checkout
        uses: actions/checkout@v6

      - name: Log in to the Container registry
        if: github.ref == 'refs/heads/develop' || github.event_name == 'workflow_dispatch'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build
        id: docker_build
        uses: docker/build-push-action@v7
        with:
          context: ./
          file: ./Dockerfile
          push: ${{ github.ref == 'refs/heads/develop' || github.event_name == 'workflow_dispatch' }}
          platforms: ${{ matrix.runner.platform }}
          tags: ${{ env.REGISTRY }}/${{ github.repository_owner }}/resiliparse-manylinux_2_28_${{ env.TARGET_ARCH }}:latest
          build-args: |
            TARGET_ARCH=${{ env.TARGET_ARCH }}

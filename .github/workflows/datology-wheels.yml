name: Datology wheels

# Builds the Resiliparse wheels that DatologyAI installs from its private CodeArtifact
# index (cp311 on manylinux x86_64/aarch64 and macOS arm64, the platforms in
# universe's uv.lock). FastWARC is not rebuilt: resiliparse pins fastwarc==1.0.9 from PyPI.
#
# - Push to a datology/** branch: build + test wheels, upload them as workflow artifacts.
# - Push a datology-v* tag: additionally publish the wheels to CodeArtifact.

on:
  push:
    branches:
      - 'datology/**'
    tags:
      - 'datology-v*'
  workflow_dispatch:

permissions:
  contents: read

env:
  CIBW_BUILD: "cp311-*"
  CIBW_SKIP: "*-musllinux*"
  CIBW_TEST_REQUIRES: "pytest fastwarc==1.0.9"
  CIBW_TEST_COMMAND: >-
    python -m pytest --capture=sys --verbose -p no:cacheprovider
    {project}/tests/resiliparse/extract {project}/tests/resiliparse/parse
  FORCE_COLOR: "1"

jobs:
  build-linux:
    strategy:
      matrix:
        include:
          - { runner: ubuntu-24.04, arch: x86_64 }
          - { runner: ubuntu-24.04-arm, arch: aarch64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # Upstream's prebuilt ghcr.io/chatnoir-eu image bakes in vcpkg dependencies without
      # our overlay ports (patched uchardet), so build the image from this branch instead.
      - name: Build manylinux image
        run: >-
          docker build --build-arg TARGET_ARCH=${{ matrix.arch }}
          -t resiliparse-manylinux_2_28_${{ matrix.arch }}:local .

      - name: Build wheels
        uses: pypa/cibuildwheel@v3.4
        with:
          package-dir: resiliparse-py
          output-dir: wheelhouse
        env:
          CIBW_ARCHS_LINUX: ${{ matrix.arch }}
          CIBW_MANYLINUX_X86_64_IMAGE: resiliparse-manylinux_2_28_x86_64:local
          CIBW_MANYLINUX_AARCH64_IMAGE: resiliparse-manylinux_2_28_aarch64:local

      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: wheels-linux-${{ matrix.arch }}
          path: ./wheelhouse/*.whl

  build-macos:
    runs-on: macos-latest
    env:
      MACOSX_DEPLOYMENT_TARGET: "12.0"
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install vcpkg dependencies
        run: |
          set -xe
          git clone https://github.com/Microsoft/vcpkg
          ./vcpkg/bootstrap-vcpkg.sh
          ./vcpkg/vcpkg install --triplet=arm64-osx

      - name: Build wheels
        uses: pypa/cibuildwheel@v3.4
        with:
          package-dir: resiliparse-py
          output-dir: wheelhouse
        env:
          CIBW_ARCHS_MACOS: arm64
          CIBW_REPAIR_WHEEL_COMMAND_MACOS: >-
            DYLD_LIBRARY_PATH=$(pwd)/vcpkg_installed/arm64-osx/lib
            delocate-wheel --require-archs arm64 -w {dest_dir} {wheel}

      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: wheels-macos-arm64
          path: ./wheelhouse/*.whl

  publish:
    if: startsWith(github.ref, 'refs/tags/datology-v')
    needs: [ build-linux, build-macos ]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download wheels
        uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: wheelhouse

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          # IAM role trusted for this repository via GitHub OIDC, allowed to publish to
          # CodeArtifact domain datologyai / repository main.
          role-to-assume: ${{ vars.CODEARTIFACT_PUBLISH_ROLE_ARN }}
          aws-region: us-east-1

      - name: Publish to CodeArtifact
        run: |
          set -xe
          python3 -m pip install twine
          aws codeartifact login --tool twine --domain datologyai --domain-owner 764487710063 --repository main
          python3 -m twine upload --repository codeartifact --non-interactive wheelhouse/*.whl

name: Set up vcpkg
description: Cache and install vcpkg dependencies

runs:
  using: composite
  steps:
    - name: Select vcpkg platform
      id: select-platform
      shell: bash
      run: |
        set -ex
        os="$(printf '%s' "$RUNNER_OS" | tr '[:upper:]' '[:lower:]')"
        arch="$(printf '%s' "$RUNNER_ARCH" | tr '[:upper:]' '[:lower:]')"
        [[ "$os" != macos ]] || os=osx
        echo "triplet=$arch-$os" >> "$GITHUB_OUTPUT"
        echo "VCPKG_DEFAULT_TRIPLET=$arch-$os" >> "$GITHUB_ENV"
        environment="$os"
        if [[ "$os" == linux ]]; then
          . /etc/os-release
          environment="$ID-$VERSION_ID"
        fi
        echo "cache-prefix=$environment-$arch-vcpkg" >> "$GITHUB_OUTPUT"

    - name: Cache vcpkg
      id: cache-vcpkg
      uses: actions/cache@v5
      with:
        path: |
          .vcpkg-inst
          ~/.cache/vcpkg/archives
          ~/AppData/Local/vcpkg/archives
        key: workspace-${{ steps.select-platform.outputs.cache-prefix }}-${{ hashFiles('**/vcpkg.json', '**/vcpkg-lock.json', 'vcpkg-configuration.json', '.vcpkg/**') }}
        restore-keys: |
          workspace-${{ steps.select-platform.outputs.cache-prefix }}-

    - name: Install vcpkg
      shell: bash
      if: steps.cache-vcpkg.outputs.cache-hit != 'true'
      run: |
        set -xe
        vcpkg_root="$GITHUB_WORKSPACE/.vcpkg-inst"
        if [[ ! -x "$vcpkg_root/vcpkg" && ! -x "$vcpkg_root/vcpkg.exe" ]]; then
          if [[ ! -d "$vcpkg_root/.git" ]]; then
            git clone --depth=1 https://github.com/Microsoft/vcpkg "$vcpkg_root"
          fi
          if [[ "$RUNNER_OS" == Windows ]]; then
            cmd.exe /c "$(cygpath -w "$vcpkg_root/bootstrap-vcpkg.bat")"
          else
            "$vcpkg_root/bootstrap-vcpkg.sh"
          fi
        fi

    - name: Add vcpkg to PATH
      shell: bash
      run: echo "$GITHUB_WORKSPACE/.vcpkg-inst" >> "$GITHUB_PATH"

    - name: Install vcpkg Dependencies
      shell: bash
      run: |
        set -xe

        if [ -d /c/vcpkg ] || [ "$(uname -s)" == "Linux" ]; then
          vcpkg install --triplet="$VCPKG_DEFAULT_TRIPLET"

        elif [ "$(uname -s)" == "Darwin" ]; then
          vcpkg install --triplet=x64-osx
          vcpkg install --triplet=arm64-osx --x-install-root vcpkg_installed2
          cp -a vcpkg_installed2/* vcpkg_installed/
          rm -r vcpkg_installed2

        else
          echo "Unsupported platform." >&2
          exit 1
        fi

    - name: Add vcpkg to library search path
      if: runner.os == 'Linux'
      shell: bash
      run: |
        echo "LD_LIBRARY_PATH=$GITHUB_WORKSPACE/vcpkg_installed/$VCPKG_DEFAULT_TRIPLET/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> "$GITHUB_ENV"

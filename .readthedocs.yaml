version: 2

sphinx:
  configuration: docs/conf.py

build:
  os: ubuntu-24.04
  tools:
    python: "3.14"
    rust: latest
  apt_packages:
    - build-essential
    - cmake
    - curl
    - git
    - libclang-dev
    - ninja-build
    - pkg-config
    - tar
    - unzip
    - zip
  jobs:
    pre_install:
      - git clone --depth=1 https://github.com/microsoft/vcpkg .vcpkg-inst
      - .vcpkg-inst/bootstrap-vcpkg.sh -disableMetrics
    install:
      - |
        set -ex
        export PATH="$READTHEDOCS_REPOSITORY_PATH/.vcpkg-inst:$PATH"
        python -m pip install --upgrade pip
        python -m pip install \
          --config-settings="maturin.build-args=--profile dev" \
          -r docs/requirements.txt \
          "./fastwarc-py[all]" "./resiliparse-py[all]"
